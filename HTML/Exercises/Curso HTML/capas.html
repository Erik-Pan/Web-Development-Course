<!DOCTYPE html>
<html lang = "es">
    <head>
        <title>Capas</title>
        <meta charset = "UTF-8">
    </head>

    <body>
        <!-- Para crear capas en HTML se ha utilizado una única etiqueta: div -->
        <div id="cabecera">
            <div id="cabecera_superior">
                <div id="datos_contacto"></div>
                <div id="iconos_sociales"></div>
                <div></div>
            </div>
            <div de="cabecera_inferior">
                <div id="logo"></div>
                <div id="menu"></div>
            </div>
        </div> 
        <!-- En la actualidad las divisiones tienen diferenciaciones en función de la división, 
        por ejemplo si se hace una cabecera. tenemos un elemento para inici-->
        <header>
            <div id="superior"></div>
            <div id="inferior"></div>
        </header>
        <!-- No sólo para la cabecera, tnemos divisiones para otro tipo de elementos:
           - footer: para crear el pie de página
           - main: para crear la parte principal de la web
           - section: para crear secciones dentro del contenido de la web
                *OJO: para crear una sección, esta debe tener un encabezado
           - article: para crear artículos que normalmente tienen encabezados y van acompañados de párrafos 
           e imágenes
           - address: para indicar datos de contacto como podrían ser email, teléfono, dirección física, etc.
           - aside: una capa para indicar información complementaia o que tiene poco que ver con el contenido 
           principal. Por ejemplo, enlaces de otras webs, publicidad
           - nav: para crear menús de navegación. Un menú de navegación se dseña como una lista de elementos
           no ordenada. Ejemplo: <nav>
                                    <ul>
                                        <li><a href="">enlace 1</a></li>
                                        <li><a href="">enlace -->
    </body>
</html>
