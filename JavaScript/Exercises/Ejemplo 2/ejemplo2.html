<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="ejemplo2.js"></script>
    <title>Segundo ejercicio de JavaScript</title>
</head>
<body>
    <h1>Segundo ejercicio de JavaScript</h1>
    <!--Hasta aquí el código HTML-->
    <script>
        /*Indicamos si un número es positivo o negativo*/
        let numero = 0;
        if(numero == 0){
            console.log("El número no es ni positivo ni negativo")
        } else {
            if(numero < 0) {
                console.log("El número es negativo")
            }else {
                console.log("El número es positivo")
            }
        }

        if(numero > 0) {
            console.log("El número es mayor que 0");
        }else {
            console.log("El número no es mayor que 0");
        }
    </script>
    <!--Vuelve a ejecutarse código HTML desde aquí-->
</body>
</html>
