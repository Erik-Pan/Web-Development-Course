<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 con JavaScript</title>
</head>
<body>
    <h1>Ejercicio 3 con JavaScript</h1>

    <script>
        let day;
        day = prompt("Introduce the day");
        day = parseInt(day);

        if(day > 0 && day <= 5){
            console.log("Working day");
        } else if(day <= 7){
            console.log("Weekend");
        }

        switch(day) {
            case 1: 
                console.log("Monday");
                break;
            case 2: 
                console.log("Thuesday");
                break;
            case 3: 
                console.log("Wednesday");
                break;
            case 4: 
                console.log("Thursday");
                break;
            case 5: 
                console.log("Friday");
                break;
            case 6: 
                console.log("Saturday");
                break;
            case 7: 
                console.log("Sunday");
                break;
            default:
                console.log("It doesn't exist");
        }

        let month = prompt("Give me the month");
        month = parseInt(month);

        if(month == 1) {
            console.log("January");
        } else if (month == 2) {
            console.log("February");
        } else if (month == 3) {
            console.log("March");
        } else if (month == 4) {
            console.log("April");
        } else if (month == 5) {
            console.log("May");
        } else if (month == 6) {
            console.log("June");
        } else if (month == 7) {
            console.log("July");
        } else if (month == 8) {
            console.log("August");
        } else if (month == 9) {
            console.log("September");
        } else if (month == 10) {
            console.log("October");
        } else if (month == 11) {
            console.log("November");
        } else if (month == 12) {
            console.log("December");
        } else {
            console.log("There's no month")
        }

        switch(month) {
            case 1: 
                console.log("January");
                break;
            case 2: 
                console.log("Fabruary");
                break;
            case 3:
                console.log("March");
                break;
            case 4:
                console.log("April");
                break;
            case 5:
                console.log("May");
                break;
            case 6:
                console.log("June");
                break;
            case 7:
                console.log("July");
                break;
            case 8:
                console.log("August");
                break;
            case 9:
                console.log("September");
                break;
            case 10:
                console.log("October");
                break;
            case 11:
                console.log("November");
                break;
            case 12:
                console.log("Decemeber");
                break;
            default:
                console.log("There's no month");
        }
    </script>
</body>
</html>
