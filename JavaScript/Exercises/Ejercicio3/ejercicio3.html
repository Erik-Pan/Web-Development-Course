<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 con JavaScript</title>
</head>
<body>
    <h1>Ejercicio 3 con JavaScript</h1>

    <script>
        let day;
        day = prompt("Introduce the day");
        day = parseInt(day);

        if(day > 0 && day <= 5){
            console.log("Working day");
        } else if(day <= 7){
            console.log("Weekend");
        }
    </script>
</body>
</html>
